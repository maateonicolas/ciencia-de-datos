    description: Clave lógica de la dimensión; integridad verificada con pruebas dbt.
  - name: dropoff_zone_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_zone')
          field: zone_key
    description: Clave lógica de la dimensión; integridad verificada con pruebas dbt.
  - name: vendor_key
