  - name: cbd_congestion_fee
    description: Importe registrado en USD, decimal(18,4); NULL no se imputa como cero y valores negativos pueden
      ser ajustes.
  - name: payload
    description: Registro original como VARIANT para trazabilidad y auditoría.
  - name: duration_seconds
    description: Diferencia en segundos entre destino y recogida.
  - name: quality_flags
    description: Advertencias que no eliminan por sí mismas un viaje.
  - name: identical_payload_count
    description: Número de filas con el mismo hash de payload; solo diagnóstico, no criterio para eliminar viajes.
  - name: rejection_reasons
    description: Reglas de invalidez incumplidas; arreglo no vacío en rechazados.
  - name: is_valid
    description: Cumple fechas presentes/ordenadas, distancia no negativa y total presente.
