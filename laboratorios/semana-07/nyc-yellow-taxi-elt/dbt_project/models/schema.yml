- name: dim_date
  description: Una fecha local observada, clave YYYYMMDD. Se utiliza para recogida y destino.
  columns:
  - name: date_key
    data_tests:
    - not_null
    - unique
    description: Clave lógica de la dimensión; integridad verificada con pruebas dbt.
  - name: calendar_date
    description: Fecha de calendario local.
  - name: year
    description: Año calendario.
  - name: month
    description: Mes calendario 1–12.
  - name: day
    description: Día del mes.
  - name: weekday_iso
    description: Día ISO, lunes 1 a domingo 7.
- name: dim_zone
  description: Una LocationID oficial más miembro desconocido -1. Roles de recogida y destino.
  columns:
  - name: zone_key
    data_tests:
    - not_null
    - unique
    description: Clave lógica de la dimensión; integridad verificada con pruebas dbt.
  - name: borough
    description: Distrito del catálogo oficial; no inferido por coordenadas.
  - name: zone
    description: Nombre oficial de la zona.
  - name: service_zone
    description: Área de servicio del catálogo.
- name: dim_vendor
  description: Un código oficial de proveedor más miembro desconocido -1.
  columns:
  - name: vendor_key
    data_tests:
    - not_null
    - unique
    description: Clave lógica de la dimensión; integridad verificada con pruebas dbt.
- name: dim_payment
  description: Un código oficial de pago más miembro desconocido -1; no mide propinas en efectivo.
  columns:
  - name: payment_key
    data_tests:
    - not_null
    - unique
    description: Clave lógica de la dimensión; integridad verificada con pruebas dbt.
- name: dim_rate
  description: Un código oficial de tarifa más miembro desconocido -1.
  columns:
  - name: rate_key
    data_tests:
    - not_null
    - unique
    description: Clave lógica de la dimensión; integridad verificada con pruebas dbt.
- name: fact_trips
  description: Una fila física válida de origen; trip_key es source_record_key. Siete FKs lógicas verificadas por
    dbt.
  columns:
  - name: trip_key
    data_tests:
    - not_null
    - unique
    description: Clave lógica del viaje físico válido de origen.
  - name: pickup_date_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
    description: Clave lógica de la dimensión; integridad verificada con pruebas dbt.
  - name: dropoff_date_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
