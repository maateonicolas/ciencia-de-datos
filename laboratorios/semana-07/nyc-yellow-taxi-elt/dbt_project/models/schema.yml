version: 2
models:
- name: bronze_trips
  description: Una fila física del Parquet vigente, sin deduplicación de negocio; conserva payload y linaje completo.
  columns:
  - name: source_record_key
    data_tests:
    - not_null
    - unique
    description: SHA-256 de mes, hash del archivo y número físico de fila; identidad técnica de origen.
  - name: source_file
    description: Nombre original del archivo Parquet.
  - name: source_month
    description: Mes del archivo de origen; no se sustituye por el mes de recogida.
  - name: source_sha256
    description: SHA-256 calculado sobre los bytes completos y validados del Parquet.
  - name: source_row
    description: Posición física de la fila en el archivo, obtenida por COPY.
  - name: loaded_at
    description: Fecha/hora de la carga original de la versión vigente en Snowflake.
  - name: payload
    description: Registro original como VARIANT para trazabilidad y auditoría.
- name: bronze_zones
  description: Una zona del catálogo oficial TLC, con hash y fecha de carga del CSV.
  columns:
  - name: location_id
    data_tests:
    - not_null
    - unique
- name: silver_trips
  description: Una fila física válida. Mantiene viajes iguales que provienen de posiciones distintas del archivo.
  columns:
  - name: source_record_key
    data_tests:
    - not_null
    - unique
    - relationships:
        arguments:
          to: ref('bronze_trips')
          field: source_record_key
    description: SHA-256 de mes, hash del archivo y número físico de fila; identidad técnica de origen.
  - name: source_file
    description: Nombre original del archivo Parquet.
  - name: source_month
    description: Mes del archivo de origen; no se sustituye por el mes de recogida.
  - name: source_sha256
    description: SHA-256 calculado sobre los bytes completos y validados del Parquet.
  - name: source_row
    description: Posición física de la fila en el archivo, obtenida por COPY.
  - name: loaded_at
    description: Fecha/hora de la carga original de la versión vigente en Snowflake.
  - name: source_occurrence
    description: Orden de ocurrencia dentro de una identidad física; mayor que uno indica duplicación de ingesta.
  - name: pickup_at
    description: Timestamp local de recogida en NYC, sin zona; no se inventa una resolución DST.
  - name: dropoff_at
    description: Timestamp local de destino en NYC, sin zona.
  - name: passenger_count
    description: Pasajeros enteros no negativos; desconocido o inválido permanece NULL.
  - name: trip_distance_miles
    description: Distancia registrada en millas, decimal(18,4); cero se conserva con advertencia.
  - name: fare_amount
    description: Importe registrado en USD, decimal(18,4); NULL no se imputa como cero y valores negativos pueden
      ser ajustes.
  - name: extra
    description: Importe registrado en USD, decimal(18,4); NULL no se imputa como cero y valores negativos pueden
      ser ajustes.
  - name: mta_tax
    description: Importe registrado en USD, decimal(18,4); NULL no se imputa como cero y valores negativos pueden
      ser ajustes.
  - name: tip_amount
    description: Importe registrado en USD, decimal(18,4); NULL no se imputa como cero y valores negativos pueden
      ser ajustes. No incluye propinas en efectivo.
  - name: tolls_amount
    description: Importe registrado en USD, decimal(18,4); NULL no se imputa como cero y valores negativos pueden
      ser ajustes.
  - name: improvement_surcharge
    description: Importe registrado en USD, decimal(18,4); NULL no se imputa como cero y valores negativos pueden
      ser ajustes.
  - name: total_amount
    description: Importe registrado en USD, decimal(18,4); NULL no se imputa como cero y valores negativos pueden
